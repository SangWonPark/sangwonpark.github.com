<!doctype html>
<html lang="{{ page.lang | default: site.locale | slice: 0,2 | default: "ko" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.7;
      color: #333;
      background-color: #fff;
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px;
      word-break: keep-all;
    }
    h1 {
      font-size: 1.6rem;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }
    h2 {
      font-size: 1.35rem;
      margin-top: 32px;
      margin-bottom: 16px;
    }
    h3 {
      font-size: 1.15rem;
      margin-top: 28px;
      margin-bottom: 12px;
    }
    ul, ol {
      padding-left: 20px;
    }
    li {
      margin-bottom: 8px;
    }
    blockquote {
      background: #f8f9fa;
      border-left: 4px solid #007aff;
      margin: 16px 0;
      padding: 12px 16px;
      font-size: 0.95rem;
      color: #555;
    }
    a {
      color: #007aff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 24px 0;
    }
    code {
      font-family: Menlo, Monaco, Consolas, monospace;
      font-size: 0.9em;
      background: #f1f3f5;
      padding: 2px 5px;
      border-radius: 4px;
    }

    /* 다크 모드 지원 */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #121212;
        color: #e0e0e0;
      }
      h1, h2, h3 {
        color: #ffffff;
        border-color: #333;
      }
      blockquote {
        background: #1e1e1e;
        border-color: #0a84ff;
        color: #ccc;
      }
      hr {
        border-color: #333;
      }
      code {
        background: #2a2a2a;
        color: #e0e0e0;
      }
      a {
        color: #58a6ff;
      }
    }
  </style>
</head>
<body>
  <h1>{{ page.title }}</h1>
  {{ content }}
</body>
</html>
